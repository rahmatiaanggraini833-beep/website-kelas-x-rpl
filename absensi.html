<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Kelas X RPL</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 15px #0001;
    }

    h1 { text-align: center; color: #1746a2; }
    .info { text-align: center; color: #666; }

    .student {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .student-name { font-weight: 600; }
    .student-number { color: #777; margin-right: 8px; }

    select {
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 7px;
      max-width: 130px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #1746a2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #hasil {
      margin-top: 16px;
      padding: 14px;
      background: #eef4ff;
      border-radius: 8px;
      white-space: pre-line;
    }

    @media (max-width: 500px) {
      body { padding: 10px; }
      .container { padding: 15px; }
      .student { align-items: flex-start; }
      .student-name { font-size: 14px; }
      select { width: 115px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>ABSENSI KELAS X RPL</h1>
    <p>Total siswa: <strong id="total"></strong></p>

    <div id="daftar-siswa"></div>

    <button onclick="rekapAbsensi()">Lihat Rekap Absensi</button>
    <div id="hasil" hidden></div>
  </main>

  <script>
    const siswa = [
      "Aditya Ibrahim",
      "Airin Ayagutara",
      "Aldo Apriansyah",
      "Alifandy Lionel Messi",
      "Daffa Insan Kamil",
      "Difa Maulana",
      "Fahri Ramadhan",
      "Fathir Abhi Ramadhan",
      "Felichia Marisca",
      "Hanif Aqilah Syah",
      "Kanifa Liyanti Hakim",
      "Keizha Queen Zullietta",
      "Maiza Zafhira Ismail",
      "Mohammad Adi Purnama",
      "Mohammad Syahrunawan",
      "Muhammad Dzulfikri As-shofa",
      "Muhammad Fathan Alkausar",
      "Muhammad Habibi Rahman",
      "Muhammad Mulki Fahri",
      "Muhammad Rafa Khairu Azzam",
      "Muhammad Al Hafizh Nashirudin Putra",
      "Mohhamad Adi Purnama",
      "Paris Zulfikar Maulana",
      "Rafa Okta Saputra",
      "Rahmatia Anggraini",
      "Raivan Mulia",
      "Rifki Andika Fujiansyah",
      "Rizky Ramadhan.z",
      "Zulayka Alifah Daysi Kalani"
    ];

    const daftar = document.getElementById("daftar-siswa");
    document.getElementById("total").textContent = siswa.length;

    siswa.forEach((nama, index) => {
      const baris = document.createElement("div");
      baris.className = "student";

      const label = document.createElement("span");
      label.className = "student-name";
      label.innerHTML = `<span class="student-number">${index + 1}.</span>`;
      label.appendChild(document.createTextNode(nama));

      const pilih = document.createElement("select");
      pilih.id = `status-${index}`;
      pilih.setAttribute("aria-label", `Status absensi ${nama}`);

      ["Belum diisi", "Hadir", "Izin", "Sakit", "Alpa"].forEach(status => {
        const opsi = document.createElement("option");
        opsi.value = status;
        opsi.textContent = status;
        pilih.appendChild(opsi);
      });

      baris.append(label, pilih);
      daftar.appendChild(baris);
    });

    function rekapAbsensi() {
      const hasil = document.getElementById("hasil");
      const jumlah = { "Hadir": 0, "Izin": 0, "Sakit": 0, "Alpa": 0, "Belum diisi": 0 };

      siswa.forEach((_, index) => {
        jumlah[document.getElementById(`status-${index}`).value]++;
      });

      hasil.hidden = false;
      hasil.textContent =
        `REKAP ABSENSI X RPL\\n` +
        `Hadir: ${jumlah.Hadir}\\n` +
        `Izin: ${jumlah.Izin}\\n` +
        `Sakit: ${jumlah.Sakit}\\n` +
        `Alpa: ${jumlah.Alpa}\\n` +
        `Belum diisi: ${jumlah["Belum diisi"]}\\n\\n` +
        `Catatan: rekap ini belum tersimpan ke Firebase.`;
    }
  </script>
</body>
</html>
